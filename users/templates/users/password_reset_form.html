{% extends 'mailing_service/base.html' %}
{% block content %}
<h2>Восстановление пароля</h2>
<p>Введите свой e-mail, и мы отправим вам инструкции по восстановлению пароля.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Отправить</button>
</form>
{% endblock %}
